# validate-and-ship — admitted workflow (N1 reference corpus; candidate
# W18). The single final shipping boundary: validate a committed change
# through the pipeline to a terminal outcome, routing every finding,
# without the validating actor ever editing the code. Promoted per the
# dev-corpus promotion spec; full behavior-unit citation trail is
# dev-corpus provenance, kept in this project's private development record, not shipped here.
#
# Seven ordinary actor stages (N1 adjudication A4 folded three
# demoted checkpoints into 20-select-intent-transport and one each into
# 40-drive-gates/60-close-out; adjudication A5 restored 00-check-scope/
# 10-do-the-work and re-rung 30-start-run to actor-stage; adjudication A6
# re-homed repo-release-verification into 20-select-intent-transport — see
# the archived provenance for the full fold record). Stage order here is
# authoritative; the directory listing under this workflow's own tree
# must agree with it lexically (.sergeant/common/contexts/icm-policy.md §1 rule 4).
#
# Reshaped in place at the 2026-08-22 distro content rebuild (W2):
# 00-check-scope gains the delivery-state declared-content-policy act;
# 40-drive-gates and 60-close-out reference @@independent-review in
# place of their scattered restatements of the never-edit rule. Stage
# list, the route-review-findings correction, and the #123 resolution
# note are unchanged.

[workflow]
