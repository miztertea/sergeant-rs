# Eight ordinary actor stages, per N1 Adjudication A4 (folds
# 50-sync-and-verify into 60-task-tracking-init and 90-completion-summary
# into 70-optional-capabilities). Stage order here is authoritative; the
# directory listing under this workflow's own tree MUST agree with it
# lexically (docs/icm/convention.md §1 rule 4).
#
# Promoted per docs/icm/promotion-spec-2026-08-11.md. The full
# behavior-unit citation trail (and the N1 Adjudication A4 reasoning) is
# archived at docs/gauntlet/promoted-provenance/sergeant-setup.md.

[workflow]
name = "sergeant-setup"
version = "2"
stages = ["00-detect-prerequisites", "05-file-capability-gaps", "10-install-commands", "20-global-config", "30-project-interview", "40-repair-existing", "60-task-tracking-init", "70-optional-capabilities"]
