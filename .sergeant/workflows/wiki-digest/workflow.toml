# docs/gauntlet/contracts/N1.md; candidate W35,
# reference-corpus/synthesis.md §1). Generates and publishes a
# schema-driven wiki digest from configured sources, previewed before
# publication and never regressing an existing page. Promoted per
# docs/icm/promotion-spec-2026-08-11.md; the full behavior-unit citation
# trail is archived at docs/gauntlet/promoted-provenance/wiki-digest.md.
#
# One ordinary actor stage (00-inspect-preview) — no engine change. Stage
# order here is authoritative; the directory listing under this
# workflow's own tree MUST agree with it lexically
# (docs/icm/convention.md §1 rule 4).

[workflow]
name = "wiki-digest"
version = "2"
stages = ["00-inspect-preview"]
