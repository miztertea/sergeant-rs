# triage — admitted workflow (N1 reference corpus,
# docs/gauntlet/contracts/N1.md, candidate W30). Works through the
# attention queue: gathered context, a recommended disposition, verified
# claims, an escalation to interview when underspecified, and the
# terminal outcome applied with its required artifact. Promoted per
# docs/icm/promotion-spec-2026-08-11.md; the full behavior-unit citation
# trail is archived at docs/gauntlet/promoted-provenance/triage.md.
#
# Five ordinary actor stages. Stage order here is authoritative; the
# directory listing under this workflow's own tree MUST agree with it
# lexically (docs/icm/convention.md §1 rule 4).
#
# Revised at ICM-R3 (docs/gauntlet/runs/icm-r3/triage/adjudication-draft.md,
# BU-TRI-04): the prior numbering had 20-verify before 30-recommend, but
# verify's own trigger text ("a recommendation has been given and
# direction received") and the upstream source's own line order (recommend
# at line 72, verify at line 74) both place verification after
# recommendation, not before. Renumbered recommend->20, verify->30; no
# behavior unit's content or placement rung changed.

[workflow]
name = "triage"
version = "3"
stages = ["10-gather-context", "20-recommend", "30-verify", "40-grill-if-underspecified", "50-apply-outcome"]
