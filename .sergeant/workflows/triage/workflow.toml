# triage — admitted workflow (N1 reference corpus,
# docs/gauntlet/contracts/N1.md, candidate W30). Works through the
# attention queue: gathered context, verified claims, a recommended
# disposition, an escalation to interview when underspecified, and the
# terminal outcome applied with its required artifact. Promoted per
# docs/icm/promotion-spec-2026-08-11.md; the full behavior-unit citation
# trail is archived at docs/gauntlet/promoted-provenance/triage.md.
#
# Five ordinary actor stages. Stage order here is authoritative; the
# directory listing under this workflow's own tree MUST agree with it
# lexically (docs/icm/convention.md §1 rule 4).

[workflow]
name = "triage"
version = "2"
stages = ["10-gather-context", "20-verify", "30-recommend", "40-grill-if-underspecified", "50-apply-outcome"]
