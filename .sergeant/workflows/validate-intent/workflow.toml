# validate-intent — optional Captain tooling (#201). Reviews an intent
# document against AGENTS.md's Captain intent discipline (the eight
# dimensions) and reports coverage per dimension. Never a mandatory gate;
# never rewrites the intent or invents content for a gap.
#
# One ordinary actor stage (00-review-intent) — no engine change. Stage
# order here is authoritative; the directory listing under this
# workflow's own tree MUST agree with it lexically
# (docs/icm/convention.md §1 rule 4).

[workflow]
name = "validate-intent"
version = "1"
stages = ["00-review-intent"]
