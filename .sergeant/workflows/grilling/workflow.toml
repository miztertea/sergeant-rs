# grilling — admitted workflow (N1 reference corpus,
# docs/gauntlet/contracts/N1.md; candidate W28,
# reference-corpus/synthesis.md §1). Grills the user relentlessly about a
# plan, decision, or idea, one question at a time. Promoted per
# docs/icm/promotion-spec-2026-08-11.md; the full behavior-unit citation
# trail is archived at docs/gauntlet/promoted-provenance/grilling.md.
#
# Two ordinary actor stages — no engine change. Stage order here is
# authoritative; the directory listing under this workflow's own tree MUST
# agree with it lexically (docs/icm/convention.md §1 rule 4).

[workflow]
name = "grilling"
version = "1"
stages = ["00-interview-loop", "10-confirm-understanding"]

# R-MVP1-11: this stage is the whole reason grilling exists — the actor asks
# one question at a time and parks on the human's answer. Declaring it lets
# submit-time preflight refuse before the first turn when the resolved
# backend cannot honour it, instead of dying mid-run on the first question.
[stage."00-interview-loop"]
requires_ask = true
