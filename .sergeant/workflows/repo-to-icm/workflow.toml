# repo-to-icm — admitted workflow (N2, docs/gauntlet/contracts/N2.md;
# proposal §9). Converts a repository's distributed procedural knowledge
# into DRAFT ICM workflow packages under .sergeant/drafts/workflows/, plus
# an evidence-backed measurement report. It does not publish workflows and
# it does not modify the engine (proposal §9.1).
#
# Eleven stages: ten actor stages (§9.2) plus one `kind = "execute"` stage
# (§11.2/§12.3, N4). Stage order here is authoritative; the directory
# listing under this workflow's own tree MUST agree with it lexically
# (docs/icm/convention.md §1 rule 4) — checked by
# scripts/validate-structure.py.
#
# v2: responds to the N2 run-2 comparison
# (docs/gauntlet/runs/n2-run2/comparison-scorecard.md,
# grammar-pressure-report.md) with content-only changes — still ten stages,
# same order, same engine. `20-harvest` gains a per-partition
# checkpoint-and-retry protocol and a mandatory consequence-class sweep
# (both new `promote`d artifacts, not new stages — see ../CONTEXT.md "v2:
# how 20-harvest handles volume" for the shape chosen and the one rejected);
# `40-classify` requires an explicit §6.3 answer before any `helper`/
# `shared-helper` classification and a self-check for the over-promotion
# tell; `80-adversarial-review` gains a fourth axis (structural
# self-consistency); `scripts/finalize.py` gains an evidence-preservation
# guard (GP-5b / issue #29).
#
# v3 (this version, MVP-2 lane D3): adds `65-self-check`, a `kind =
# "execute"` stage between `60-draft` and `70-lint` — this is N4's
# adjudicated first real execute stage (docs/gauntlet/contracts/N4.md,
# 2026-08-12 ADJUDICATION: "cheap, fast, and runnable constantly ...
# repo-to-icm's validate-structure.py run"). It runs
# `scripts/validate-structure.py` against this workflow's own tree in a
# pinned container and writes its result to `65-self-check/output/
# self-check-result.txt`; `70-lint`'s own "How to do it" no longer invokes
# the validator against this workflow's own tree itself — it reads that
# file instead (`70-lint/CONTEXT.md`). Content-only otherwise: no other
# stage's contract changed.

[workflow]
name = "repo-to-icm"
version = "3"
stages = ["00-contract", "10-inventory", "20-harvest", "30-normalize", "40-classify", "50-synthesize", "60-draft", "65-self-check", "70-lint", "80-adversarial-review", "90-reconcile"]

[stage."65-self-check"]
kind = "execute"
image = "python:3.13"
command = ["sh", "-c", "python3 /workspace/.sergeant/workflows/repo-to-icm/scripts/validate-structure.py > /workspace/.sergeant/workflows/repo-to-icm/65-self-check/output/self-check-result.txt 2>&1"]
workdir = "/workspace"
workspace_access = "read_write"
network = "none"
