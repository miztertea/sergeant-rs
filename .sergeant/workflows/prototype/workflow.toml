# prototype — admitted workflow (N1 candidate W21,
# docs/gauntlet/contracts/N1.md). Builds a throwaway prototype (logic/state
# or UI) to answer one design question, then captures the validated result
# into production code.
#
# Six stages, branching at 00-select-branch between mutually-exclusive
# 20L-build-logic / 20U-build-variants (see ../CONTEXT.md "Notes for
# reviewers" for why this is packaged as two stage directories, with the
# non-selected one a documented no-op for a given run, rather than a
# conditional-stage schema extension). Promoted per
# docs/icm/promotion-spec-2026-08-11.md; full behavior-unit citation trail
# archived at docs/gauntlet/promoted-provenance/prototype.md.

[workflow]
name = "prototype"
version = "1"
stages = ["00-select-branch", "10-record-question", "20L-build-logic", "20U-build-variants", "30-hand-off", "40-capture"]
