# NEW package. Absorbs the retired `record-decisions` package's contract
# as a named section inside `10-establish-structure` and
# `30-verify-fidelity-and-facts` — not as a separate package and not as a
# separate stage. Sergeant has no profile construct; "profile" here
# means a section inside these stage contexts (see this package's own
# Notes for reviewers).

[workflow]
name = "author-document"
version = "1"
stages = ["00-map-sources", "10-establish-structure", "20-draft", "30-verify-fidelity-and-facts", "35-challenge", "40-finalize"]
