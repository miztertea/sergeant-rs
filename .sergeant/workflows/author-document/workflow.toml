# author-document — produce a document as the deliverable, with fidelity
# to the brief as the top-weighted review axis.
#
# Authored 2026-08-22 for the distro content rebuild
# (W2). Derivation and the evidence behind each stage: the design
# proposal §E.6, its stage vocabulary, and the owner rulings recorded
# there are dev-corpus provenance, kept in this project's private development record, not shipped here.
#
# Six ordinary actor stages. Stage order here is authoritative; the
# directory listing under this workflow's own tree MUST agree with it
# lexically (.sergeant/common/contexts/icm-policy.md §1 rule 4).
#
# NEW package. Absorbs the retired `record-decisions` package's contract
# as a named section inside `10-establish-structure` and
# `30-verify-fidelity-and-facts` — not as a separate package and not as a
# separate stage. Sergeant has no profile construct; "profile" here
# means a section inside these stage contexts (see this package's own
# Notes for reviewers).

[workflow]
name = "author-document"
version = "1"
stages = ["00-map-sources", "10-establish-structure", "20-draft", "30-verify-fidelity-and-facts", "35-challenge", "40-finalize"]
