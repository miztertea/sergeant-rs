# investigate — answer a bounded question against evidence, with a
# stated stopping condition, and leave a durable cited artifact.
#
# Authored 2026-08-22 for the distro content rebuild
# (W2). Derivation and the evidence behind each stage: the design
# proposal §E.3, its stage vocabulary, and the owner rulings recorded
# there are dev-corpus provenance, kept in this project's private development record, not shipped here.
#
# Six ordinary actor stages. Stage order here is authoritative; the
# directory listing under this workflow's own tree MUST agree with it
# lexically (.sergeant/common/contexts/icm-policy.md §1 rule 4).
#
# Descends from the retired `research` (1 stage) and `wayfinder` (4
# stages). `wayfinder/00-name-destination` is deleted, not carried:
# naming a destination requires a live interview, which R-NS-6 places in
# Captain, before dispatch — `00-frame` frames what the intent already
# names, it never interviews. `wayfinder`'s ticket-graph/map mechanics
# (10/30/40) do not survive as workflow stages; their frontier/fog
# framing concept folds into `00-frame`'s stopping-condition contract.

[workflow]
name = "investigate"
version = "1"
stages = ["00-frame", "10-fan-out-evidence", "20-synthesize", "25-challenge", "30-record", "40-close"]
