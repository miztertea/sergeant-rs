# soak-verify — small local workflow authored for the EXTENDED #19 soak
# (docs/gauntlet/notes/mvp-bucketing-2026-08-11.md MVP-4: "multi-hour,
# real Claude, envelope-guarded, Docker verify stages"). Not an admitted
# sergeant-rs workflow; lives in this scratch subject repo as workflow
# content, per the repo's own rule that workflows are ordinary data a
# subject repo may author for itself.
#
# Three stages, the N4 actor -> execute -> actor proof shape: a small real
# actor turn, a cheap `kind = "execute"` Docker verify stage, and a second
# actor turn that reads the execute stage's evidence and confirms it.

[workflow]
name = "soak-verify"
version = "1"
stages = ["10-touch", "20-docker-check", "30-confirm"]

[stage."20-docker-check"]
kind = "execute"
image = "alpine:3.20"
command = ["sh", "-c", "test -f /workspace/notes/status.md && wc -l /workspace/notes/status.md > /workspace/.sergeant/workflows/soak-verify/20-docker-check/output/check.txt && echo checked-ok >> /workspace/.sergeant/workflows/soak-verify/20-docker-check/output/check.txt"]
workdir = "/workspace"
workspace_access = "read_write"
network = "none"
