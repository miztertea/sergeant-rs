name: CI

# ADR 0004 (D9): this is the cheap per-PR tier — Linux fmt/clippy/test plus
# a macOS lane, run on every pull request so wall-clock stays low (matrix
# jobs run concurrently, so cost is max(job) not sum(job)). The full
# real-suite matrix
# across all measured targets (ADR 0001 D1) is a qualification capability, not
# a routine trigger on this workflow — see matrix.yml (workflow_call /
# workflow_dispatch, per ADR 0014 decision 9).
on:
  # No push trigger, deliberately. Every commit reaches main through a pull
  # request whose head tree — for this repo's single-writer, up-to-date-merge
  # flow — is byte-identical to the merge commit, so a post-merge re-run of
  # this same battery proved nothing twice a day. Main's ongoing health is
  # covered where it can actually change: the weekly canary (floating
  # toolchain/runners) and release.yml's gates re-qualifying the exact SHA at
  # dispatch. The README badge reads ?event=pull_request for the same reason.
  pull_request:
  # release.yml's Gate B calls this workflow rather than re-defining "tests
  # passed" (proposal §9.2 / §16 — release qualification never invents an
  # alternate CI contract). workflow_call adds no new jobs and changes no
  # existing trigger's behavior.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # S2 V1c (build/test speed): split from one `ci` job into two that run in
  # parallel — fmt+clippy+docs-consistency here, test execution in `test`
  # below. Both start from the same dependency graph (dev profile,
  # --all-targets), so they share one rust-cache entry (`shared-key: ci`)
  # rather than each seeding its own; wall-clock is max(job), not sum(job),
  # same reasoning ADR 0004 (D9) already applies to the Linux/macOS split
  # above. Job names changed (`ci` → `fmt-clippy` + `test`) — branch
  # protection's required-status-check list must name both, not the old
  # single `ci`, or a PR could merge on fewer gates than before this split.
  fmt-clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two steps, deliberately: bare file-driven `rustup toolchain install`
      # ignores `-c` flags on the runner's rustup (proven on this repo's
      # first pinned CI run — it installed the minimal profile's 3
      # components and cargo fmt then failed), while `rustup component add`
      # always targets the active toolchain rust-toolchain.toml selects.
      - name: rustup toolchain install (rust-toolchain.toml pins the version)
        run: rustup toolchain install
      - name: rustup component add clippy rustfmt (file-selected toolchain)
        run: rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: docs-consistency (README release literals match the current version)
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].version')
          stale=$(grep -noE 'releases/(download|tag)/v[0-9]+\.[0-9]+\.[0-9]+|release download v[0-9]+\.[0-9]+\.[0-9]+' README.md \
            | grep -v "v${version}\b" || true)
          if [ -n "$stale" ]; then
            echo "::error::README.md references a release version other than the current v${version}:"
            echo "$stale"
            exit 1
          fi

      - name: git diff --exit-code (no step above should have mutated a tracked file)
        run: git diff --exit-code

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: rustup toolchain install (rust-toolchain.toml pins the version)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci

      # S2 V1c: measured ~42% wall-clock reduction over `cargo test --locked`
      # on this suite (warm, single run — see
      # knowledge/evidence/perf/build-test-speed-2026-08-26.md in the
      # workspace estate). Exact-pinned, same as this repo's other
      # taiki-e/install-action tool installs (coverage.yml, release.yml).
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.99

      - name: cargo nextest run
        run: cargo nextest run --locked

      - name: git diff --exit-code (no step above should have mutated a tracked file)
        run: git diff --exit-code

  shellcheck:
    # ADR 0004 (D7): hygiene, not a version gate — shellcheck has no bash-3.2
    # target mode, so it cannot enforce the scripts/ floor. The macos-check
    # job below only runs `cargo check` (type-check, no test execution), so
    # it does NOT exercise scripts/demo.sh; the real enforcement of the
    # bash-3.2 floor is matrix.yml's full-suite `cargo test` on macos-26
    # (via tests/m6_surfaces.rs t4's scripts/demo.sh subprocess), which runs
    # via workflow_call from release.yml's Gate C, or by manual
    # workflow_dispatch — never on a routine push. Gated at
    # --severity=error only: a 2026-08-14 sweep of all 25 scripts/**/*.sh
    # found the tree clean at that threshold but carrying ~84 pre-existing
    # warning/note/style findings (mostly SC2154 false positives from the
    # perf harness's `perf_mark VAR` return-by-name convention, plus SC2034
    # on intentionally-external vars). Triaging those individually is out of
    # scope here; this still gives every future change a real,
    # currently-clean gate against actual shell bugs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck (errors only — see comment above for the warning backlog)
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=error

  macos-check:
    # ADR 0004 (D9) / ADR 0002 (D2): the macOS module is `#[cfg]`-selected and
    # not compiled at all on Linux, so breaking it is invisible locally — this
    # is the compensating lane, run per push. `cargo check` on an actual
    # macos-26 runner rather than a literal Linux->macOS cross-compile:
    # the `duckdb` dependency's `bundled` feature compiles DuckDB's C++ from
    # source via its own build script, which needs a real Apple toolchain
    # (cross-compiling that from Linux needs an osxcross-style Apple SDK
    # extraction that hosted runners don't carry). Since this repo is public,
    # a real macos-26 runner is free and unmetered (ADR 0004 D9), so it's
    # both cheaper and more faithful than fighting a cross C++ toolchain.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: rustup toolchain install (rust-toolchain.toml pins the version)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo check
        run: cargo check --locked --all-targets

  msrv:
    # W1 §E: a measured floor, not recon's static 1.88.0 prediction — the
    # extra minor version came from this crate's own use of
    # std::fs::File::try_lock/TryLockError (stabilized 1.89.0), which a
    # cargo-metadata pass over dependency rust-version fields cannot see.
    # Check only, no clippy — lint policy belongs to the pinned dev compiler
    # (rust-toolchain.toml), not to this floor.
    #
    # S3 X3b (F5d / A1-27): the floor moved 1.89.0 -> 1.98.0 together with
    # Cargo.toml's rust-version, and it had to move in the SAME commit —
    # cargo refuses to build a package whose rust-version exceeds the invoked
    # compiler, so a 1.89.0 floor against a 1.98.0 rust-version is not a stale
    # comment, it is a red job.
    #
    # NOTE FOR REVIEW: the floor now equals rust-toolchain.toml's pin, so this
    # job no longer exercises an *older* compiler than the rest of CI — as of
    # this commit it is a duplicate `--locked --all-targets` check. Whether to
    # retire it or to re-establish a genuinely older measured floor is a
    # decision this wave had no authority to take, and did not take.
    runs-on: ubuntu-24.04
    env:
      # Single source of truth for this job's two uses below. Keep in sync
      # with Cargo.toml's rust-version (see the comment there) — YAML and TOML
      # can't share a literal without added machinery, so this only collapses
      # the duplication within this job, from two sites to one.
      MSRV: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: rustup toolchain install (the declared MSRV floor)
        run: rustup toolchain install ${{ env.MSRV }} --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo check --locked --all-targets (MSRV floor — check only, no clippy from this job)
        run: cargo +${{ env.MSRV }} check --locked --all-targets

  dependency-policy:
    # proposal §5.2: routine PRs check bans/licenses/sources only. Advisories
    # deliberately excluded here — a new RustSec advisory can land against an
    # unchanged Cargo.lock and turn an unrelated documentation PR red
    # overnight. Advisories are a release-time gate instead: release.yml's
    # Gate E runs the full `cargo deny check`, including advisories.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "cargo metadata --locked (guard: belt-and-suspenders around the action's own --locked argument below)"
        run: cargo metadata --locked --format-version 1 >/dev/null

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check bans licenses sources

  dependency-review:
    # GitHub's own dependency-review action: diffs the PR's dependency
    # manifests and can block a PR introducing a known-vulnerable
    # dependency. It only understands pull_request events (it diffs base vs.
    # head refs) — this workflow also runs on push to main and workflow_call,
    # where there is no PR diff to review, so the job is scoped out there
    # rather than running meaninglessly or failing for lack of a base ref.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
