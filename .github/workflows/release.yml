# The release workflow. Proposal §7-§13, re-scoped by ADR 0014 decision 2
# (co-versioning) and decision 9 (this workflow composes ci.yml/matrix.yml/
# coverage.yml rather than redefining their contracts).
#
# There is exactly one release authority: a human dispatching this workflow
# from the Actions UI. No tag watcher, no push trigger, no cron — dry-run is
# the default `mode` so an accidental "Run workflow" click cannot publish
# anything.
#
# CO-VERSIONING CONSTRAINT (ADR 0014 decision 2, NORTH-STAR "Not true yet"
# note): v0.x.y is supposed to name ONE artifact identity — the `sgt` binary
# AND the embedded distro it writes via `sgt init`. That embedding does not
# exist yet: `sgt init` today writes only `sergeant.toml`, `repos/`, and
# `.gitignore`. This workflow therefore packages and ships the binary alone
# and says so in the draft release body — it does NOT claim to ship an
# embedded distro it cannot produce. NORTH-STAR's "Not true yet" note is the
# standing record of this gap; nothing here weakens or removes it.
#
# Issue #165 (the originally-cited tracker for this) closed 2026-08-17 via
# rung R2 — it made the gap visible (`sgt doctor` now reports a zero-package
# estate) but explicitly rejected the full embedding fix as Phase 3's job
# (reference/proposal-product-workspace-split.md). The embedding gap this
# comment describes is therefore still real; #165 itself is just the wrong
# citation for it now. There is no dedicated open issue for full distro
# embedding yet — when Phase 3 lands (or a tracking issue is filed for it),
# this workflow's packaging step and release-body template both need a
# follow-up change to actually embed and describe the distro.
#
# GATE F (distro structural validator): still does not run from this
# workflow — sergeant-rs-workspace is private, and giving this release path
# a token to read it is worse than not checking (see that repo's
# knowledge/rulings/gate-f-ci-lives-here-2026-08-18.md). The property Gate F
# names is proven continuously by sergeant-rs-workspace's own CI
# (.github/workflows/validate.yml, PR ws#3, `validate-distro-live` job),
# which checks out this repo read-only and runs `validate-distro` against it
# on every PR and every push to this repo's main. A release therefore
# inherits a continuously-proven property rather than re-proving it at
# release time. Tracked as issue #176, now settled by that PR.
#
# DIST'S DEFAULT TOPOLOGY IS NOT ADOPTED (proposal §7/§10: "dist may own
# packaging mechanics. Sergeant owns release authority."). `dist init`
# generates its own CI recommendation triggered `on: push: tags: ...` — a
# tag watcher, exactly what proposal §7 forbids as a release-initiating
# event. This workflow never uses that generated workflow at all: `dist` is
# invoked only as a plain `dist build` subcommand (see the `package` and
# `package-installer` jobs below), called from jobs that already sit behind
# `workflow_dispatch` and Gates A-F. The git tag this workflow eventually
# creates is a side effect of `gh release create`/`gh release edit` in
# `draft-release`/`publish`, run only after every gate and packaging step
# has succeeded — dist's build mechanics never see or create that tag
# themselves; they take it as an input (`--tag`) once we already know we
# are publishing. Confirmed by measurement, not merely asserted:
# docs/measure-dist-conditions-2026-08-18.md condition 4 directly exercised
# `dist build --artifacts=local` from a branch push with no `v*` tag in the
# repository at all, and found `dist`'s packaging mechanics indifferent to
# how they are triggered. See also docs/measure-dist-2026-08-18.md
# (condition 1 / bundled-DuckDB build feasibility) for the sibling
# measurement this workflow's `package` job is based on.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version being released, e.g. 0.2.0. Must equal Cargo.toml's
          package version at the released commit (Gate A) — this input is a
          confirmation, not an instruction to bump anything.
        required: true
        type: string
      mode:
        description: >-
          Dry-run performs every gate and packaging step, including
          assembling a real draft GitHub Release with uploaded assets (this
          is what proves packaging and the release manifest actually work)
          — but deletes that draft before the job ends, on every path
          including failure and cancellation. It never creates a git tag
          and never publishes anything durable.
        required: true
        type: choice
        options:
          - dry-run
          - publish
        default: dry-run

# One release attempt in flight at a time — a second dispatch while one is
# running is a mistake, not a legitimate concurrent release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: v${{ inputs.version }}

jobs:
  # ── Gate A — repository state ──────────────────────────────────────────
  # Proposal §9.1 / §8: confirm the exact revision and every version
  # invariant before anything else runs. Failing here creates no tag and no
  # release — this job does nothing but check facts.
  gate-a-repo-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: running against main, HEAD is current main HEAD
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::release.yml must be dispatched against main, was dispatched against ${{ github.ref }}" >&2
            exit 1
          fi
          remote_head=$(git rev-parse origin/main)
          if [ "$GITHUB_SHA" != "$remote_head" ]; then
            echo "::error::dispatched commit $GITHUB_SHA is not origin/main's HEAD ($remote_head) — main moved since dispatch" >&2
            exit 1
          fi

      - name: requested version == Cargo.toml version
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$cargo_version" != "$RELEASE_VERSION" ]; then
            echo "::error::input version $RELEASE_VERSION does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - name: v<version> tag does not already exist
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::tag $RELEASE_TAG already exists" >&2
            exit 1
          fi
          if git ls-remote --tags origin "$RELEASE_TAG" | grep -q .; then
            echo "::error::tag $RELEASE_TAG already exists on origin" >&2
            exit 1
          fi

      - name: CHANGELOG contains the version
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md does not exist" >&2
            exit 1
          fi
          if ! grep -qF "$RELEASE_VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not mention $RELEASE_VERSION" >&2
            exit 1
          fi

  # ── Gate B — reuse ci.yml's contract ───────────────────────────────────
  # Proposal §9.2: release qualification never defines an alternate notion
  # of "tests passed." This calls the exact same workflow every PR runs.
  gate-b-ci:
    needs: gate-a-repo-state
    uses: ./.github/workflows/ci.yml
    # ci.yml's dependency-review job declares `pull-requests: read`. A called
    # workflow's GITHUB_TOKEN permissions can only stay the same or become
    # MORE restrictive — a callee that tries to elevate past its caller is
    # rejected at startup, before any job exists. Granting only
    # `contents: read` here made the entire release run fail with
    # `startup_failure` and zero jobs. A caller must grant the UNION of what
    # every job in the called workflow declares, not what the gate itself
    # appears to need.
    permissions:
      contents: read
      pull-requests: read

  # ── Gate C — full measured-platform matrix ─────────────────────────────
  # Proposal §9.3. matrix.yml already exposes workflow_call (Slice 3).
  gate-c-matrix:
    needs: gate-a-repo-state
    uses: ./.github/workflows/matrix.yml
    permissions:
      contents: read

  # ── Gate D — coverage ───────────────────────────────────────────────────
  # Proposal §9.4. Same S-series convention and 90-line floor as every other
  # coverage measurement — no second coverage number for releases.
  gate-d-coverage:
    needs: gate-a-repo-state
    uses: ./.github/workflows/coverage.yml
    permissions:
      contents: read

  # ── Gate E — strict dependency policy ──────────────────────────────────
  # Proposal §5.2 / §9.5: routine PRs check bans/licenses/sources only;
  # release qualification runs the FULL `cargo deny check`, advisories
  # included, so a known RustSec advisory cannot silently enter a release.
  gate-e-cargo-deny:
    needs: gate-a-repo-state
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check (full — advisories, bans, licenses, sources)
        run: cargo deny check --locked

  # ── Gate F — distro structural validator ───────────────────────────────
  # Does not execute here — see the top-of-file comment for why (workspace
  # repo is private; a read token for it is worse than not checking). The
  # validator this gate names lives in sergeant-rs-workspace's
  # .sergeant/local/workflows/validate-distro/ by deliberate placement (ADR
  # 0014 decision 5). The property is proven continuously, not skipped
  # outright: sergeant-rs-workspace's own CI (.github/workflows/validate.yml,
  # PR ws#3) runs validate-distro against a public checkout of this repo on
  # every PR and push to that repo's main, so a release cutting from this
  # repo's main inherits a property already proven at that commit rather
  # than needing to re-prove it here. Tracked as issue #176, settled by that
  # PR.
  gate-f-distro-validator:
    needs: gate-a-repo-state
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Gate F does not run here — proven continuously in sergeant-rs-workspace (issue #176)
        run: |
          echo "::notice::Gate F (distro structural validator) does not run from this workflow. The property it names is proven continuously by sergeant-rs-workspace's own CI (.github/workflows/validate.yml, PR ws#3), which runs validate-distro against this repo on every PR and push to its main. This release inherits that continuously-proven property rather than re-proving it at release time. Tracked as issue #176."
          {
            echo '## Gate F — distro structural validator: proven upstream, not re-run here'
            echo 'Does not execute in this workflow. Proven continuously by `sergeant-rs-workspace`'"'"'s own CI (`.github/workflows/validate.yml`, PR ws#3, `validate-distro-live` job), which runs `validate-distro` against this repo on every PR and push to its `main`. See issue #176.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Package ─────────────────────────────────────────────────────────────
  # Only after A-F. Measured on real GitHub-hosted runners, both targets,
  # 2026-08-18 (docs/measure-dist-2026-08-18.md, proposal §10 condition 1):
  # `dist build` successfully builds sgt with bundled DuckDB and packages it
  # on both ubuntu-24.04 (897s cold build) and macos-26 (1002s cold
  # build), with no disk or cache pressure on either. Binary behavioral
  # equivalence and the generated installer's correctness (conditions 2-3)
  # were additionally measured against a real archive on ubuntu-24.04
  # (docs/measure-dist-conditions-2026-08-18.md) and found identical to an
  # ordinary `cargo build --release` binary, including the embedded distro.
  # (ubuntu-24.04/macos-26 are the exact images the prior floating-alias
  # runner labels served on the 2026-08-18 measurement date — the runner
  # below is now pinned to those images directly, so this measurement is
  # not stale relative to the pin.)
  #
  # aarch64-apple-darwin per ADR 0001's measured-target set: the *build*
  # succeeded on a real macos-26 runner (above), but binary equivalence
  # and installer correctness were not re-measured on macOS — see docs/adr/
  # 0018-measured-vocabulary-obligation-clean-build-not-full-validation.md,
  # which clarifies ADR 0001 D8's "measured" vocabulary. Per that ruling,
  # "unmeasured" on macOS means the code is written and should be right but
  # is not fully validated there; it does not block. This job still builds
  # and packages the macOS target, and this workflow does not claim macOS
  # installer or binary behavior beyond a clean build/package having
  # succeeded.
  package:
    needs:
      - gate-b-ci
      - gate-c-matrix
      - gate-d-coverage
      - gate-e-cargo-deny
      - gate-f-distro-validator
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-26
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bare file-driven install ignores side flags like `-t` (see ci.yml's
      # note on `-c`); add the target explicitly. Today both matrix legs are
      # host-native so this is belt-and-braces, but it stops being a no-op
      # the day a non-native target joins the matrix.
      - name: rustup toolchain install (rust-toolchain.toml pins the version)
        run: rustup toolchain install
      - name: rustup target add ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: record build environment
        run: |
          mkdir -p target/distrib
          {
            echo "commit: ${{ github.sha }}"
            echo "target: ${{ matrix.target }}"
            echo "runner-os: ${{ runner.os }}"
            echo "runner-arch: ${{ runner.arch }}"
            echo
            echo "--- rustc -Vv ---"
            rustc -Vv
            echo
            echo "--- cargo -V ---"
            cargo -V
            echo
            echo "--- git --version ---"
            git --version
            echo
            echo "--- bash --version ---"
            bash --version
          } > target/distrib/build-environment-${{ matrix.target }}.txt

      # dist is bootstrapped from its attested, checksum-pinned prebuilt
      # tarball — NOT `curl … cargo-dist-installer.sh | sh`. Measured against
      # axodotdev's own v0.32.0 release assets (w3-recon.md §1, 2026-08-21):
      # cargo-dist-installer.sh has no `.sha256` sidecar, is absent from the
      # aggregate `sha256.sum`, and has no build-provenance attestation at all
      # (`gh attestation verify cargo-dist-installer.sh --repo
      # axodotdev/cargo-dist` → HTTP 404). The per-target tarballs have both.
      # The two checks prove different things and neither subsumes the other:
      # the committed sha256 pins the exact v0.32.0 bytes we qualified (an
      # attestation alone would accept a *different* axodotdev-built tarball
      # served from this URL), and `gh attestation verify` proves those bytes
      # came out of axodotdev/cargo-dist's own release workflow rather than
      # merely matching a hash someone uploaded. Bumping the version means
      # re-recording both sha256 literals from that release's `sha256.sum` —
      # deliberately, so a version bump is a qualification, not a
      # one-character edit. Lives in scripts/release/install-dist.sh, shared
      # by both bootstrap sites (package, package-installer), so there is one
      # copy of the pinned hashes to re-qualify, not two (same pattern as
      # verify-installer-checksums.sh below).
      - name: install dist 0.32.0 (checksum-pinned + attestation-verified tarball)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/install-dist.sh 0.32.0

      - name: "cargo metadata --locked (guard: dist build has no native --locked/--frozen flag)"
        run: cargo metadata --locked --format-version 1 >/dev/null

      # `--output-format=json` makes dist write this target's build manifest,
      # which carries the archive's sha256. `package-installer` downloads it and
      # `dist build --artifacts=global` reads the checksum straight out of it, so
      # the generated installer ships real checksum values instead of the empty
      # ones every release before 0.1.2 shipped (w3-recon.md §2a). The manifest
      # is written OUTSIDE target/distrib and copied in afterwards, because
      # `dist build` owns that directory while it runs — this is the exact order
      # cargo-dist's own generated CI uses (templates/ci/github/release.yml.j2 @
      # v0.32.0: `dist build … --output-format=json > dist-manifest.json` then
      # `cp dist-manifest.json "$BUILD_MANIFEST_NAME"`, where BUILD_MANIFEST_NAME
      # is target/distrib/<target>-dist-manifest.json). The <target>- filename
      # prefix is that same convention and is what keeps the two matrix legs'
      # manifests from colliding in the merged download.
      - name: dist build (packages the binary + LICENSE/README + checksum)
        run: |
          set -euo pipefail
          dist build --artifacts=local --target ${{ matrix.target }} \
            --output-format=json > "${RUNNER_TEMP}/local-dist-manifest.json"
          cp "${RUNNER_TEMP}/local-dist-manifest.json" \
            "target/distrib/${{ matrix.target }}-dist-manifest.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: target/distrib/*
          if-no-files-found: error

  # ── Package: shell installer ────────────────────────────────────────────
  # Proposal §12's remaining named artifact — the `curl ... | sh` installer.
  # This is `dist`'s "global" artifact class (built once per app, not once
  # per target), so it is its own job rather than another matrix leg of
  # `package`. `dist build --artifacts=global` only needs the configured
  # target list and a tag to render the installer's download URLs — it does
  # not need that target's binary to already be built (verified locally
  # against this exact `dist` version/config before landing this job: a
  # global-artifacts build with no prior local build present still produces
  # `sergeant-rs-installer.sh`). Runs after the same gates as `package`;
  # this is packaging mechanics only, per the top-of-file note on dist's
  # topology — it does not create or depend on the release tag existing in
  # the repository, only on being told what tag string to embed.
  #
  # This job produces the installer script; `package` (above) produces the
  # per-archive `.sha256` files and, since 0.1.2, a per-target
  # `<target>-dist-manifest.json`. Those manifests are what wire the two
  # together: `dist build --artifacts=global` reads each archive's sha256 out
  # of them and renders it into the installer's per-artifact case arms, so the
  # generated `sergeant-rs-installer.sh` now verifies what it downloads before
  # extracting it. This is cargo-dist's own mechanism — its generated CI
  # downloads the local jobs' artifacts into target/distrib/ before the global
  # build for exactly this reason — not a patch on its output; nothing here
  # post-processes the generated script.
  #
  # Before 0.1.2 the manifests were never passed forward, so the installer's
  # verification branch was unreachable and every install printed "no checksums
  # to verify" (docs/measure-dist-conditions-2026-08-18.md, condition 3, and its
  # 2026-08-19 amendment — an accurate record of the behavior on that date, not
  # of the behavior now). The two steps after the global build below are what
  # keep that from silently regressing: one asserts every released target's arm
  # carries a real sha256, the other installs from a local origin and then
  # proves a substituted archive is actually rejected.
  #
  # `needs: package` exists for the manifests only — a global artifact is still
  # built once per app rather than once per target, and this job still never
  # needs any target's binary. It costs nothing downstream: `draft-release`
  # already waits on `smoke-test` and `sbom`, which already wait on `package`.
  #
  # Checksums are not the whole story and the README says so: they prove the
  # archive matches what the release published, not that the release came from
  # this repository. Provenance is `gh attestation verify` against the
  # build-provenance attestation `draft-release` (below) creates.
  package-installer:
    needs:
      - gate-b-ci
      - gate-c-matrix
      - gate-d-coverage
      - gate-e-cargo-deny
      - gate-f-distro-validator
      - package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: rustup toolchain install (rust-toolchain.toml pins the version; closes this job's prior lack of a pinned toolchain)
        run: rustup toolchain install

      # dist is bootstrapped from its attested, checksum-pinned prebuilt
      # tarball — NOT `curl … cargo-dist-installer.sh | sh`. Measured against
      # axodotdev's own v0.32.0 release assets (w3-recon.md §1, 2026-08-21):
      # cargo-dist-installer.sh has no `.sha256` sidecar, is absent from the
      # aggregate `sha256.sum`, and has no build-provenance attestation at all
      # (`gh attestation verify cargo-dist-installer.sh --repo
      # axodotdev/cargo-dist` → HTTP 404). The per-target tarballs have both.
      # The two checks prove different things and neither subsumes the other:
      # the committed sha256 pins the exact v0.32.0 bytes we qualified (an
      # attestation alone would accept a *different* axodotdev-built tarball
      # served from this URL), and `gh attestation verify` proves those bytes
      # came out of axodotdev/cargo-dist's own release workflow rather than
      # merely matching a hash someone uploaded. Bumping the version means
      # re-recording both sha256 literals from that release's `sha256.sum` —
      # deliberately, so a version bump is a qualification, not a
      # one-character edit. Lives in scripts/release/install-dist.sh, shared
      # by both bootstrap sites (package, package-installer), so there is one
      # copy of the pinned hashes to re-qualify, not two (same pattern as
      # verify-installer-checksums.sh below).
      - name: install dist 0.32.0 (checksum-pinned + attestation-verified tarball)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/install-dist.sh 0.32.0

      - name: "cargo metadata --locked (guard: dist build has no native --locked/--frozen flag)"
        run: cargo metadata --locked --format-version 1 >/dev/null

      # Get the per-target build manifests `package` produced (and, harmlessly,
      # the archives beside them) so `dist build --artifacts=global` can read
      # each archive's sha256 out of them and render it into the installer's
      # per-artifact case arms. This is cargo-dist's own mechanism, not a patch
      # on its output: its generated CI performs the same download into
      # target/distrib/ before the global build, under the comment "Get all the
      # local artifacts for the global tasks to use (for e.g. checksums)".
      # This job still does not need any target's *binary* — only the manifest
      # JSON — so the reason this is a separate job from `package` (a global
      # artifact is built once per app, not once per target) is unchanged.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "dist-*"
          path: target/distrib
          merge-multiple: true

      - name: dist build --artifacts=global (shell installer only)
        run: |
          dist build --artifacts=global \
            --target x86_64-unknown-linux-gnu \
            --target aarch64-apple-darwin \
            --tag "$RELEASE_TAG"

      - name: assert the generated installer carries a checksum for every released target
        run: |
          set -euo pipefail
          installer=target/distrib/sergeant-rs-installer.sh
          populated=$(grep -c '^[[:space:]]*_checksum_value="[0-9a-f]\{64\}"$' "$installer" || true)
          if [ "$populated" -ne 2 ]; then
            echo "::error::generated installer has $populated populated checksum value(s), expected 2 (one per released target) — dist did not see a per-target build manifest for every target" >&2
            grep -n '_checksum_style\|_checksum_value\|\.tar\.xz")' "$installer" >&2 || true
            exit 1
          fi
          echo "::notice::generated installer carries $populated per-artifact sha256 values"

      # Proves the property, rather than asserting it: a good archive installs,
      # a substituted one is rejected with a non-zero exit and nothing installed.
      # Lives in scripts/ so ci.yml's shellcheck job lints it and so it can be
      # re-run by hand against any published release's assets.
      - name: installer smoke test — accepts a good archive, rejects a substituted one
        run: |
          scripts/release/verify-installer-checksums.sh \
            target/distrib/sergeant-rs-installer.sh \
            target/distrib \
            "$RELEASE_TAG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-installer
          path: target/distrib/sergeant-rs-installer.sh
          if-no-files-found: error

  # ── Smoke test ──────────────────────────────────────────────────────────
  # Proposal §13: extract into a clean environment (a fresh job, not the
  # build tree) and verify the binary actually runs before trusting it.
  smoke-test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-26
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist-artifact

      - name: extract into a clean directory and run sgt --version
        run: |
          set -eu
          mkdir -p smoke
          tar xf dist-artifact/sergeant-rs-${{ matrix.target }}.tar.xz -C smoke
          bin=$(find smoke -name sgt -type f)
          "$bin" --version
          got=$("$bin" --version | awk '{print $2}')
          if [ "$got" != "$RELEASE_VERSION" ]; then
            echo "::error::smoke-tested binary reports version $got, expected $RELEASE_VERSION" >&2
            exit 1
          fi

  # ── SBOM ────────────────────────────────────────────────────────────────
  # One generator, target-scoped (proposal §22 unknown 5: "verify the
  # emitted CycloneDX document correctly describes Sergeant's target-specific
  # release before admitting it instead of layering a second generator").
  # cargo-dist 0.32.0 has no built-in SBOM output (checked via `dist plan`);
  # cargo-cyclonedx's `--describe binaries --target <triple>` produces a
  # per-binary, per-target document — verified 2026-08-17: its
  # metadata.component names the `sgt` binary specifically, not the whole
  # workspace, for the built target.
  sbom:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-26
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Bare file-driven install ignores side flags like `-t` (see ci.yml's
      # note on `-c`); add the target explicitly. Today both matrix legs are
      # host-native so this is belt-and-braces, but it stops being a no-op
      # the day a non-native target joins the matrix.
      - name: rustup toolchain install (rust-toolchain.toml pins the version)
        run: rustup toolchain install
      - name: rustup target add ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: "cargo metadata --locked (guard: cargo-cyclonedx has no native --locked/--frozen flag)"
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: generate target-scoped CycloneDX SBOM for the sgt binary
        run: |
          cargo cyclonedx --format json --describe binaries \
            --target ${{ matrix.target }} --target-in-filename
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.target }}
          path: sgt_bin_${{ matrix.target }}.cdx.json
          if-no-files-found: error

  # ── Assemble draft, attest, verify manifest ────────────────────────────
  # Section 6.2: this job gets contents: write only because it must create
  # a draft release; it does not get any other job's authority. Attestation
  # sub-steps get id-token/attestations write on top, nothing else.
  #
  # This job runs identically in both modes — proposal §13 lists "assemble
  # draft release" and "verify the release manifest" as steps a dry run is
  # supposed to prove, so dry-run does not skip them. What differs is the
  # very last step: in dry-run it deletes the draft this job just created,
  # with `if: always()` so the deletion runs whether the job succeeded,
  # failed partway through, or was cancelled. The one gap that step cannot
  # close: if the runner itself is killed before GitHub Actions gets a
  # chance to execute an always() step (e.g. the whole runner disappears),
  # nothing local can run cleanup — the draft would need removing by hand.
  # That is a platform-level limit, not a gap in this design.
  draft-release:
    needs:
      - smoke-test
      - sbom
      - package-installer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      release-id: ${{ steps.capture-release-id.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pattern "dist-*" matches dist-x86_64-unknown-linux-gnu,
      # dist-aarch64-apple-darwin, AND dist-installer — the shell installer
      # lands in release-assets alongside the archives with no separate
      # download step needed.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "dist-*"
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "sbom-*"
          path: release-assets
          merge-multiple: true

      - name: SHA-256 manifest (reuses dist's per-archive .sha256 files — no second generator)
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          echo "manifest:" && cat SHA256SUMS.txt

      - name: GitHub artifact attestations — build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.xz
            release-assets/sergeant-rs-installer.sh

      # One attest-sbom step per target: subject-path/sbom-path are 1:1 in
      # this action, so a single step spanning both tar.xz files would
      # attest the aarch64 archive against the x86_64 SBOM — wrong evidence
      # for that platform, and a direct contradiction of the SBOM job's own
      # point (target-scoped documents, not one generator for everything).
      - name: GitHub artifact attestations — SBOM (x86_64-unknown-linux-gnu)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "release-assets/sergeant-rs-x86_64-unknown-linux-gnu.tar.xz"
          sbom-path: "release-assets/sgt_bin_x86_64-unknown-linux-gnu.cdx.json"

      - name: GitHub artifact attestations — SBOM (aarch64-apple-darwin)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "release-assets/sergeant-rs-aarch64-apple-darwin.tar.xz"
          sbom-path: "release-assets/sgt_bin_aarch64-apple-darwin.cdx.json"

      - name: verify release manifest — every promised asset is present
        run: |
          set -eu
          cd release-assets
          for f in \
            sergeant-rs-x86_64-unknown-linux-gnu.tar.xz \
            sergeant-rs-x86_64-unknown-linux-gnu.tar.xz.sha256 \
            sergeant-rs-aarch64-apple-darwin.tar.xz \
            sergeant-rs-aarch64-apple-darwin.tar.xz.sha256 \
            sgt_bin_x86_64-unknown-linux-gnu.cdx.json \
            sgt_bin_aarch64-apple-darwin.cdx.json \
            sergeant-rs-installer.sh \
            SHA256SUMS.txt \
            build-environment-x86_64-unknown-linux-gnu.txt \
            build-environment-aarch64-apple-darwin.txt; do
            if [ ! -f "$f" ]; then
              echo "::error::release manifest missing expected asset $f" >&2
              exit 1
            fi
          done

      - name: assemble DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes_section=$(awk '/^## /{if (found) exit; if ($0 ~ /'"$RELEASE_VERSION"'/) found=1; next} found' CHANGELOG.md)
          {
            echo "$notes_section"
            echo
            echo "---"
            echo
            echo "**Co-versioning note:** this release ships the \`sgt\` binary only."
            echo "v${RELEASE_VERSION} does NOT yet ship an embedded distro — that"
            echo "is Phase 3 scope (reference/proposal-product-workspace-split.md),"
            echo "not yet tracked by a dedicated open issue. See CHANGELOG.md and"
            echo "NORTH-STAR.md's \"Not true yet\" note."
            echo
            echo "**Gate F (distro structural validator) did not run in this workflow.**"
            echo "That property is proven continuously by sergeant-rs-workspace's own CI"
            echo "(.github/workflows/validate.yml, PR ws#3) against this repo's main —"
            echo "see issue #176."
          } > /tmp/release-notes.md
          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v${RELEASE_VERSION}" \
            --notes-file /tmp/release-notes.md \
            --draft \
            release-assets/*.tar.xz \
            release-assets/*.sha256 \
            release-assets/*.cdx.json \
            release-assets/sergeant-rs-installer.sh \
            release-assets/SHA256SUMS.txt \
            release-assets/build-environment-*.txt

      # A tag is not a unique key for a draft — GitHub lets multiple drafts
      # share one tag_name, which is exactly what let a stale dry-run draft
      # get published instead of this run's draft (see git history on this
      # step). From here on, every operation on the release this job just
      # created — cleanup below, and the publish job in a later job —
      # addresses it by database ID, captured once, right here, immediately
      # after the create above returns. The draft-release job never runs
      # concurrently with another release attempt (top-of-file `concurrency`
      # group), so at this exact moment "the release with this tag_name" is
      # unambiguous — this is the one and only place in the workflow where
      # a tag-based lookup is still safe.
      - name: capture release ID (by tag, for the last time in this workflow)
        id: capture-release-id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          release_id=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.tag_name == "'"$RELEASE_TAG"'")][0].id')
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "::error::could not find the release just created for tag $RELEASE_TAG" >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      # Dry-run only. Runs on every path — success, a failed step above, or
      # the job being cancelled mid-run — because `if: always()` steps still
      # execute after a cancellation signal (GitHub Actions runs them like a
      # `finally` block, within the runner's cancellation grace period).
      # Primary lookup is $RELEASE_ID from the capture step above; the
      # fallback re-derives it by tag_name for the one case that step can't
      # cover — the job was cancelled (or `gh release create` itself failed
      # partway through an asset upload) before the capture step ever ran,
      # leaving a partially-uploaded draft with no captured ID. The list
      # endpoint (unlike `releases/tags/{tag}`) includes drafts, so this
      # fallback finds it. If the runner is killed outright before any
      # always() step can execute at all, no step here can run — that is a
      # platform-level limit, not a gap in this cleanup.
      - name: dry-run cleanup — delete the draft this run created
        if: always() && inputs.mode == 'dry-run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          release_id="${RELEASE_ID:-}"
          if [ -z "$release_id" ]; then
            release_id=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
              --jq '[.[] | select(.tag_name == "'"$RELEASE_TAG"'")][0].id // empty')
          fi
          if [ -n "$release_id" ] && [ "$release_id" != "null" ]; then
            echo "::notice::dry-run cleanup: deleting draft release id $release_id (tag $RELEASE_TAG)"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$release_id"
          else
            echo "::notice::dry-run cleanup: no draft found for tag $RELEASE_TAG — nothing to remove"
          fi

  # ── Publish ─────────────────────────────────────────────────────────────
  # Only reached in `mode: publish`. Publishes by release ID, not by tag —
  # `draft-release` emits the ID of the exact draft it created as a job
  # output, and this job edits that ID directly. A tag can name more than
  # one draft (see the capture-release-id step in `draft-release`), so
  # resolving by tag here would risk publishing whichever draft GitHub
  # happens to return for that tag, not necessarily this run's — which is
  # precisely how a stale dry-run draft got published instead of the
  # qualified one. dry-run never reaches this job at all (the `if` below);
  # its draft is created and deleted entirely inside `draft-release`.
  publish:
    needs: draft-release
    if: ${{ inputs.mode == 'publish' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: publish the release this run created, by ID (this is what makes the tag/assets durable)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft-release.outputs.release-id }}
        run: |
          set -eu
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::draft-release did not emit a release-id output — refusing to guess which draft to publish" >&2
            exit 1
          fi
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -f draft=false -f make_latest=true

  # ── Verify latest ──────────────────────────────────────────────────────
  # `make_latest=true` above is a request, not a guarantee — GitHub's
  # "latest" resolution is eventually consistent. Confirm this run's own
  # tag is what /releases/latest actually reports before we call the
  # publish durable, retrying to ride out the lag rather than racing it.
  verify-latest:
    needs: [draft-release, publish]
    if: ${{ inputs.mode == 'publish' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: assert the published release is reported as latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft-release.outputs.release-id }}
        run: |
          set -eu
          published_tag=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" -q .tag_name)
          attempt=1
          latest_tag=""
          while [ "$attempt" -le 5 ]; do
            latest_tag=$(gh api "repos/${{ github.repository }}/releases/latest" -q .tag_name)
            if [ "$latest_tag" = "$published_tag" ]; then
              echo "::notice::releases/latest reports $latest_tag, matching published tag $published_tag"
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "::error::releases/latest reports '$latest_tag', expected published tag '$published_tag'" >&2
          exit 1
