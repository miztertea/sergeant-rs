# TEMPORARY measurement workflow. Not part of the repo's real CI surface.
# Answers proposal §10 conditions 2 and 3 (§22 unknowns not covered by
# measure/dist-duckdb's condition-1 run). Removed in a follow-up commit on
# this branch once the run completes and results are recorded in
# docs/measure-dist-conditions-2026-08-18.md.
#
# Trigger deviation, same reasoning as measure/dist-duckdb: workflow_dispatch
# only registers once a workflow file lives on the default branch, and this
# task is scoped to not touch main. Scoped push trigger on this exact branch
# is the R7-minimal substitute.
name: measure-dist-conditions-TEMPORARY

on:
  push:
    branches:
      - measure/dist-conditions

permissions:
  contents: read

jobs:
  condition-2-and-3:
    runs-on: ubuntu-latest
    steps:
      - name: checkout feat/embed-distro (PR #179 — the embedded-distro sgt init path)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: feat/embed-distro
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: install dist 0.32.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh

      - name: ordinary cargo release build
        run: cargo build --release

      - name: persist shell installer config (repo doesn't declare one yet)
        run: sed -i '/^targets = /a installers = ["shell"]' Cargo.toml

      - name: dist build — local artifacts (target-specific archive)
        run: dist build --artifacts=local --target x86_64-unknown-linux-gnu

      - name: dist build — global artifacts (curl-sh installer)
        run: dist build --artifacts=global --tag=v0.1.0

      - name: extract dist archive
        run: |
          mkdir -p /tmp/dist-extract
          tar xf target/distrib/sergeant-rs-x86_64-unknown-linux-gnu.tar.xz -C /tmp/dist-extract
          find /tmp/dist-extract -name sgt -type f

      - name: condition 2 — compare --version / --help
        run: |
          set -eu
          CARGO_BIN=$PWD/target/release/sgt
          DIST_BIN=$(find /tmp/dist-extract -name sgt -type f)
          echo "cargo: $($CARGO_BIN --version)"
          echo "dist:  $($DIST_BIN --version)"
          diff <($CARGO_BIN --version) <($DIST_BIN --version) && echo "VERSION: IDENTICAL"
          diff <($CARGO_BIN --help) <($DIST_BIN --help) && echo "HELP: IDENTICAL"

      - name: condition 2 — compare sgt doctor
        run: |
          set -eu
          CARGO_BIN=$PWD/target/release/sgt
          DIST_BIN=$(find /tmp/dist-extract -name sgt -type f)
          mkdir -p /tmp/estate-cargo /tmp/estate-dist
          (cd /tmp/estate-cargo && "$CARGO_BIN" doctor) || true
          (cd /tmp/estate-dist && "$DIST_BIN" doctor) || true

      - name: condition 2 — compare sgt init (241 files / 17 packages, embedded distro)
        run: |
          set -eu
          CARGO_BIN=$PWD/target/release/sgt
          DIST_BIN=$(find /tmp/dist-extract -name sgt -type f)
          rm -rf /tmp/init-cargo /tmp/init-dist
          mkdir -p /tmp/init-cargo /tmp/init-dist
          (cd /tmp/init-cargo && "$CARGO_BIN" init)
          (cd /tmp/init-dist && "$DIST_BIN" init)
          echo "cargo file count: $(find /tmp/init-cargo -type f | wc -l)"
          echo "dist file count:  $(find /tmp/init-dist -type f | wc -l)"
          echo "cargo package count: $(find /tmp/init-cargo/.sergeant/workflows -mindepth 1 -maxdepth 1 -type d | wc -l)"
          echo "dist package count:  $(find /tmp/init-dist/.sergeant/workflows -mindepth 1 -maxdepth 1 -type d | wc -l)"
          diff -rq /tmp/init-cargo /tmp/init-dist | grep -v 'sergeant.toml' && echo "TREES: NO DIFFERENCES BEYOND sergeant.toml (estate name)" || true

      - name: condition 3 — inspect installer's default download URL
        run: |
          grep -n 'ARTIFACT_DOWNLOAD_URLS=\"https://github.com' target/distrib/sergeant-rs-installer.sh || true

      - name: condition 3 — run installer in a clean environment against a local artifact server
        run: |
          set -eu
          cp target/distrib/sergeant-rs-x86_64-unknown-linux-gnu.tar.xz* /tmp/
          (cd /tmp && python3 -m http.server 8899 &)
          sleep 2
          rm -rf /tmp/installer-home
          SERGEANT_RS_DOWNLOAD_URL="http://127.0.0.1:8899" \
          CARGO_HOME="/tmp/installer-home" \
            sh target/distrib/sergeant-rs-installer.sh
          /tmp/installer-home/bin/sgt --version

      - name: condition 3 — confirm installer fails without an override (no real release exists)
        run: |
          set +e
          rm -rf /tmp/installer-home-real
          CARGO_HOME="/tmp/installer-home-real" sh target/distrib/sergeant-rs-installer.sh
          echo "exit code: $?"
