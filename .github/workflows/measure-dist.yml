# TEMPORARY measurement workflow. Not part of the release pipeline.
#
# Answers proposal §22 unknown 1 (DuckDB + dist) for exactly the two targets
# named in proposal §11 / ADR 0001's measured set: does `dist build` produce
# a release archive for the bundled-DuckDB crate on a standard GitHub-hosted
# runner, and at what cost in wall clock, disk, and cache?
#
# This is a measurement, not a pipeline change. It is removed in a follow-up
# commit on the same branch once its output has been recorded in
# docs/measure-dist-2026-08-18.md.
name: measure-dist (TEMPORARY)

on:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: disk before checkout
        run: df -h . || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: rust-cache (report hit/miss)
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/measure/dist-duckdb' }}

      - name: record cache outcome
        run: |
          echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: install dist (pinned to workspace.metadata.dist's cargo-dist-version)
        run: |
          t0=$(date +%s)
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
          t1=$(date +%s)
          echo "install-dist-seconds=$((t1 - t0))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: disk before build
        run: df -h . || true

      - name: dist build (timed)
        id: build
        run: |
          set -o pipefail
          t0=$(date +%s)
          dist build --artifacts=local --target ${{ matrix.target }} 2>&1 | tee /tmp/dist-build.log
          status=$?
          t1=$(date +%s)
          echo "dist-build-seconds=$((t1 - t0))" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "dist-build-exit=$status" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: disk after build
        if: always()
        run: df -h . || true

      - name: target/ size breakdown
        if: always()
        run: du -sh target 2>/dev/null || echo "target/ not present"

      - name: du of largest target subdirs
        if: always()
        run: du -sh target/* 2>/dev/null | sort -rh | head -20 || true

      - name: archive size
        if: always()
        run: |
          ls -lh target/distrib/ 2>/dev/null || echo "no target/distrib"

      - name: summarize
        if: always()
        run: |
          {
            echo "## measure-dist result: ${{ matrix.target }} on ${{ matrix.os }}"
            echo "- dist-build exit: ${{ steps.build.outcome }}"
            echo "- runner: ${{ matrix.os }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: measure-dist-${{ matrix.target }}
          path: |
            target/distrib/*
            /tmp/dist-build.log
          if-no-files-found: warn
