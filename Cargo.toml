[package]
name = "sergeant-rs"
version = "0.3.0"
edition = "2024"
# Keep in sync with the `msrv` job's `env.MSRV` in .github/workflows/ci.yml
# (W1 spec §E) — cargo has no way to read this field back into that job's
# `run:` steps without added machinery, so the two are hand-synced.
#
# S3 X3b (F5d / A1-27): 1.89.0 -> 1.98.0. This is paperwork the A1 plan routed
# onto the first A1-dependency PR, not a new constraint discovered here: the
# pinned dev compiler in rust-toolchain.toml has been 1.98.0, and 1.89.0 was a
# floor nothing had re-verified. The two fields cannot move independently —
# `cargo +1.89 check` refuses outright once this says 1.98.0 — so ci.yml's
# `env.MSRV` moves in the same commit.
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/miztertea/sergeant-rs"
description = "Local execution surface for coding agents: durable work, isolated git worktrees, and a complete evidence trail behind one daemon"

[[bin]]
name = "sgt"
path = "src/main.rs"

# S4 Y1 (G2): the supervised parse-worker's own binary. `worker.rs`'s
# transport spawns this — never `sgt` itself — as a child, over a
# `program: PathBuf` the caller names explicitly (`std::env::current_exe()`
# in the daemon, `env!("CARGO_BIN_EXE_sgt-atlas-worker")` in tests), so
# neither surface has to guess the other's path. Y1 ships the transport plus
# a trivial, honestly-labeled body (one Document unit for UTF-8 input) and
# the test-only `--fault` fixture modes the supervision acceptance needs;
# Y2 replaces the body with the real Anydoc adapter behind the same CLI
# contract, which is why this is a real `[[bin]]` rather than a
# `tests/`-only helper.
[[bin]]
name = "sgt-atlas-worker"
path = "src/bin/atlas_worker.rs"

[dependencies]
axum = "0.8"
blake3 = "1.8.6"
clap = { version = "4.6.6", features = ["derive"] }
# S3 X4 (F4): `json` + `parquet` join `bundled`. Both are DuckDB's *own*
# built-in readers compiled into the bundled library — no new crate joins the
# graph (the `Cargo.lock` package count is unchanged by this line) and nothing
# is downloaded at runtime. CSV was already in DuckDB's core, which is why no
# `csv` feature exists to ask for. Rungs, in order: R2 fails (nothing here
# reads Parquet or JSON-as-a-table), R3/R4 fail (neither std nor the OS reads
# columnar files), R5 is exactly this rung — the reader already lives inside a
# dependency this crate builds, and asking for it costs a feature flag rather
# than a crate. The alternative R5 displaces is the one F4 forbids: leaving
# the features off and letting DuckDB *autoload* `json`/`parquet` at query
# time, which is a network install on first use. `AtlasDb` pins autoloading
# and autoinstalling off (`runtime/atlas/db`'s `HARDENING_DDL`), so these
# readers are compiled in or they are absent — and absent is not something a
# tabular dataset source can live with. Footprint measured, not asserted: see
# this wave's commit body and `target/f4-footprint.txt`.
duckdb = { version = "1", features = ["bundled", "json", "parquet"] }
# S3 X2 (F10): the scanner needs glob matching for two things a manifest and a
# constant both spell in glob syntax — the built-in secrets deny set and each
# `[[knowledge]] ignore` entry. Rungs, in order: R2 fails (nothing in this
# crate matches globs; `is_plain_name` answers a different question), R3 fails
# (std has no glob matcher and `Path` comparison cannot express `**/*.pem`),
# R4 fails (the OS offers no portable one — shell globbing would mean spawning
# a shell over operator-supplied patterns, which is worse than a dependency in
# every respect), R5 fails (nothing already in the graph exposes glob
# matching; `regex` is present but making operators write regexes for an
# `ignore` list is a worse contract, and translating globs to regexes by hand
# is the very R7 this rung exists to avoid), R6 fails (a correct `**`
# implementation with alternates and character classes is not one line — it is
# the bug farm every hand-rolled matcher becomes). R5-as-new-edge → declare
# globset: ripgrep's own matcher, `default-features = false` because the only
# default feature is `log`, which buys nothing here. Its own graph is
# aho-corasick + regex-automata/regex-syntax, all already resolved for this
# build, plus `bstr` and `fnv`.
globset = { version = "0.4.20", default-features = false }
include_dir = { version = "0.7.4", default-features = false }
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics"] }
# §34's TUI stack. The M6 budget names "ratatui + crossterm"; crossterm is
# deliberately *not* a second direct entry. ratatui 0.30 selects and re-exports
# its own crossterm (`ratatui::crossterm`), and a separate `crossterm = "0.29"`
# line here would be a second copy of the same crate that Cargo is free to
# resolve to a different version — at which point a `KeyEvent` from our
# crossterm is a different type from the one ratatui's backend produces, and
# the failure is a type error at best and a silently ignored key at worst.
# Naming it through ratatui makes agreement structural (R1: the lower rung —
# do not add a dependency edge whose only effect is a way to be wrong).
# This narrows a contract-enumerated list ("ratatui + crossterm"), which is the
# same shape as the registered deviation D5; the delta is not yet in the
# deviation register because M6's MARK & LOG has not run. Pinned as a test —
# `the_tui_stack_is_ratatui_with_crossterm_reached_through_it` in
# tests/m6_surfaces.rs — so the omission stays deliberate rather than becoming
# a fact nobody re-decided.
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
toml = "1.1.4"
toml_edit = { version = "0.25", features = ["parse", "display"] }
tracing = "0.1.44"
tracing-subscriber = "0.3"
# S3 X3b (F5): language-aware symbol/import extraction. Rungs, in order: R2
# fails (nothing in this crate parses source code; X2's `text.rs` splits
# Markdown on heading bytes and answers a different question), R3 fails (std
# has no parser for any of these languages), R4 fails (the OS offers none
# either), R5 fails (nothing already in the graph parses source — `toml`/
# `toml_edit` cover exactly one of the six languages and only as values, not
# as a syntax tree with byte ranges, which is what `source.occurrences` is
# keyed on), R6 fails (six hand-written parsers is the largest bug farm this
# repo could adopt, and a regex "symbol finder" is precisely the silent
# partial parse F5's exact-match criterion exists to forbid). R5-as-new-edge →
# tree-sitter plus one grammar per language actually indexed.
#
# The grammar set is the LEAN one, not `tree-sitter-language-pack` (TSLP): the
# pack resolves 143 crates for 371 languages and, at its default features
# (`download` + `dynamic-loading`), FAILS this repo's `cargo deny` on MPL-2.0
# (`option-ext` via `dirs`/`dirs-sys`) — recorded verbatim in
# tests/fixtures/tslp_corpus/SPIKE-F5.md. Its `download` feature also fetches
# parsers over the network at runtime, which is the same posture F4 forbids
# for DuckDB extension autoload. Eight direct crates / ten new lock entries
# buy the six languages F5 names and nothing else (R1 on the other 365).
tree-sitter = "0.26.13"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
ulid = "3.0.0"

# #310: `prctl(PR_SET_PDEATHSIG, SIGKILL)` on a probe child, and nothing else.
# R3/R4 fail — neither the standard library nor any process API this crate
# already uses can couple a child's death to its parent's; only the kernel can,
# and only through this call. R5 rather than R7: libc is already in this
# crate's dependency graph (transitively, via tokio/reqwest/duckdb), so
# declaring it directly adds a line here and no crate to the build. `nix` was
# the alternative and would be a genuinely new graph edge for one constant and
# one call. Unix-gated because that is the only place it is referenced.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# M5 Unknown #1 — "the duckdb crate's bundled-build cost in this container
# (compile time and disk) — measure first". Measured here, dev profile, before
# this override: libduckdb.a 2.08 GB, liblibduckdb_sys.rlib 2.0 GB, and every
# integration-test binary that links it ~770 MB, for 15 GB of `target/` on a
# disk with ~16 GB free. That is survivable for `cargo test` alone but not for
# `cargo clippy --all-targets`, which needs its own check-profile copy of the
# same C build and died in `ar` with ENOSPC — i.e. a project gate was silently
# unrunnable. Nearly all of that bulk is DWARF: cc-rs passes `-g` to the ~500
# bundled C++ translation units whenever the profile asks for debug info.
# Fallback taken instead of a feature gate or a leaner store (both of which
# would change what M5 ships): keep the proposal-named crate (R5) and drop
# debug info from that one package's artifacts. Rust-side debug info is
# untouched, and nobody in this project steps through DuckDB's C++.
[profile.dev.package.libduckdb-sys]
debug = false

# #299 (owner-ratified 2026-08-26): generalize the same trade to every
# dependency — nobody in this project steps through dependency code, and
# the per-suite test binaries each carry the whole dep graph's DWARF.
# The workspace crate itself keeps full debug info (a specific package
# entry and the crate's own artifacts are unaffected by this wildcard),
# so panic backtraces through sergeant code stay symbolized. Measured on
# Cerberus at adoption: fresh `cargo build --tests` target 20 GB -> see
# the qualification PR for the after numbers.
[profile.dev.package."*"]
debug = false

[dev-dependencies]
# Synchronously decoding an axum `Response` body in `tests/i9_floor_pinning.rs`
# (spec §6.3 compensating assertion (c): calling the real `below_floor_refusal`
# and inspecting its wire shape) — the version already pinned transitively by
# axum 0.8's own `http-body-util` dependency.
http-body-util = "0.1"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "testing"] }
# S3 X3b: `tests/x3b_tslp_corpus.rs` reads its hand-verified expectations from
# `tests/fixtures/tslp_corpus/manifest.toml`. Both crates are already direct
# `[dependencies]` of this crate at these exact versions — an integration test
# links the library plus dev-dependencies, not the library's own dependencies,
# so naming them here adds two lines and ZERO packages to the resolved graph
# (R5, verified: `Cargo.lock` package count is unchanged by these two entries).
# The alternative, a hand-rolled parser for the manifest, is the R6/R7 bug farm
# the rung order exists to prevent.
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3"
toml = "1.1.4"
# S3 X4 (F4): `tests/x4_tabular_map.rs` writes a real `.parquet` fixture, so
# the Parquet reader is proven end-to-end on actual Parquet bytes rather than
# inferred from a linked symbol. Same rung and same arithmetic as the two
# entries above — `duckdb` is already a direct `[dependencies]` entry at this
# exact version, so this line adds ZERO packages to the resolved graph (R5,
# verified: the `Cargo.lock` package count is unchanged by it). It is a
# *fixture writer* and nothing else: no test opens Atlas's own store with it,
# which is what `tests/x1_atlas_substrate.rs`'s one-owner assertion is about.
duckdb = { version = "1", features = ["bundled", "json", "parquet"] }

# Packaging mechanics for release.yml (proposal §10: "`dist` may own packaging
# mechanics. Sergeant owns release authority."). `ci = "github"` still selects
# dist's GitHub-shaped artifact naming/manifest conventions, but this repo
# does NOT run `dist generate` and does NOT adopt dist's own generated
# workflow — that workflow triggers on `push: tags`, which conflicts with the
# workflow_dispatch-only release authority this repo requires (ADR 0014
# decision 9 / proposal §7). `allow-dirty = ["ci"]` is what lets `dist build`
# run without a generated `.github/workflows/release.yml` present or in sync;
# release.yml instead shells out to `dist build`/`dist host` as a build step,
# nothing more. Targets are exactly ADR 0001 D1's measured set minus the
# WSL2-under-Windows case dist has no native concept of (release ships a
# Linux binary there, same as ADR 0001) — see release.yml's own comment for
# the aarch64-apple-darwin verification gap this repo could not close from a
# Linux-only CI environment.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
allow-dirty = ["ci"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
# proposal §12's "shell installer" artifact (`curl ... | sh`). Adopted here,
# not merely built by hand, because condition 3 (measure-dist-conditions,
# 2026-08-18) measured this exact generated installer's mechanics against a
# real archive and found them correct.
installers = ["shell"]

# dist's expected release-build profile name. Inherits release rather than
# adding new optimization flags of its own (R1: no new tuning surface until
# a measured need shows up).
[profile.dist]
inherits = "release"
