[package]
name = "sergeant-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sgt"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.6"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.4"
tracing = "0.1.44"
ulid = "3.0.0"

[dev-dependencies]
tempfile = "3"
